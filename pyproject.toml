[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-tracking"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "tifffile>=2023.7",
  "matplotlib>=3.7",
  "networkx>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
